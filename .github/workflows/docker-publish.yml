name: Build and Push Docker Image to GHCR

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  docker-ghcr:
    name: Build & Push Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name to lowercase
        id: prep
        run: |
          # GHCR mewajibkan nama image seluruhnya huruf kecil (lowercase)
          RAW_IMAGE="ghcr.io/${{ github.repository }}"
          LOWER_IMAGE=$(echo "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$LOWER_IMAGE" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.image_name }}:${{ github.sha }}
            ${{ steps.prep.outputs.image_name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Laravel Application Multi-stage Docker Image

